[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyosys-scan-chain"
version = "0.1.0"
description = "Scan-chain wrapper generator using pyosys."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyosys",
]

[project.optional-dependencies]
dev = []

[project.scripts]
scan-chain-builder = "scan_chain_builder:main"

[tool.setuptools]
package-dir = {"" = "src/python"}
py-modules = ["scan_chain_builder", "scan_chain_core", "cpp_interface"]
